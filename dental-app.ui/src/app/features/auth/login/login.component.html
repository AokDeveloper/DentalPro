<p-toast></p-toast>

<div class="flex align-items-center justify-content-center min-h-screen surface-ground p-4">
    <div class="surface-card p-5 shadow-6 w-full" style="max-width: 450px; border-radius: 1.5rem;">
        
        <div class="text-center mb-5">
            <div class="flex align-items-center justify-content-center mb-4">
                <div class="border-circle bg-primary flex align-items-center justify-content-center shadow-3" style="width: 60px; height: 60px;">
                    <i class="pi pi-heart-fill text-white" style="font-size: 1.8rem;"></i>
                </div>
            </div>
            <div class="text-900 text-3xl font-bold mb-2">DentalApp</div>
            <span class="text-500 font-medium line-height-3">Sisteme erişmek için giriş yapın</span>
        </div>

        <form (ngSubmit)="onLogin()">
            <div class="mb-4">
                <label for="email" class="block text-700 font-semibold mb-2">E-posta Adresi</label>
                <input id="email" name="email" type="text" pInputText [(ngModel)]="loginModel.email" 
                       class="w-full p-3 border-round-lg" placeholder="ornek@dentalapp.com" autocomplete="off">
            </div>

            <div class="mb-4">
                <label for="password" class="block text-700 font-semibold mb-2">Şifre</label>
                <p-password id="password" name="password" [(ngModel)]="loginModel.password" [toggleMask]="true" 
                            styleClass="w-full" inputStyleClass="w-full p-3 border-round-lg" 
                            [feedback]="false" placeholder="Şifrenizi girin"></p-password>
            </div>

            <div class="flex align-items-center justify-content-between mb-5">
                <div class="flex align-items-center">
                    <p-checkbox id="remember" name="remember" [binary]="true" inputId="remember"></p-checkbox>
                    <label for="remember" class="text-600 ml-2 font-medium cursor-pointer">Beni Hatırla</label>
                </div>
                <a class="font-medium no-underline ml-2 text-primary cursor-pointer text-sm hover:underline">Şifremi Unuttum</a>
            </div>

            <button pButton pRipple type="submit" label="Giriş Yap" icon="pi pi-sign-in" 
                    class="w-full p-3 text-lg font-bold border-round-lg shadow-2" 
                    [loading]="loading">
            </button>
        </form>

    </div>
</div>
