<p-toast></p-toast>

<div class="flex align-items-center justify-content-center min-h-screen bg-gray-100">
    <div class="surface-card p-4 shadow-2 border-round w-full lg:w-4">
        <div class="text-center mb-5">
            <div class="text-900 text-3xl font-medium mb-3">DentalApp'e Hoş Geldiniz</div>
            <span class="text-600 font-medium line-height-3">Devam etmek için lütfen giriş yapın</span>
        </div>

        <div>
            <label for="email" class="block text-900 font-medium mb-2">E-posta</label>
            <input id="email" type="text" pInputText [(ngModel)]="loginModel.email" class="w-full mb-3" placeholder="E-posta adresiniz">

            <label for="password" class="block text-900 font-medium mb-2">Şifre</label>
            <p-password id="password" [(ngModel)]="loginModel.password" [toggleMask]="true" class="w-full mb-3" inputStyleClass="w-full" [feedback]="false" placeholder="Şifreniz"></p-password>

            <button pButton pRipple label="Giriş Yap" icon="pi pi-user" class="w-full" [loading]="loading" (click)="onLogin()"></button>
        </div>
    </div>
</div>
