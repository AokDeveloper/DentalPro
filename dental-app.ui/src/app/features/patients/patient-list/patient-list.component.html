<div class="grid">
    <div class="col-12">
        <div class="card">
            <h5>Hasta Listesi</h5>
            
            <p-table 
                #dt 
                [value]="patients" 
                [rows]="10" 
                [loading]="loading" 
                [paginator]="true" 
                [globalFilterFields]="['fullName','phoneNumber']" 
                responsiveLayout="scroll"
                [rowHover]="true"
                dataKey="id"
                currentPageReportTemplate="{totalRecords} kayıttan {first} ile {last} arası gösteriliyor"
                [showCurrentPageReport]="true">

                <ng-template pTemplate="caption">
                    <div class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
                        <span class="block mt-2 md:mt-0 p-input-icon-left">
                            <i class="pi pi-search"></i>
                            <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')" placeholder="Ara..." />
                        </span>
                        <button pButton pRipple label="Yeni Hasta" icon="pi pi-plus" class="p-button-success mr-2"></button>
                    </div>
                </ng-template>

                <ng-template pTemplate="header">
                    <tr>
                        <th pSortableColumn="fullName">Ad Soyad <p-sortIcon field="fullName"></p-sortIcon></th>
                        <th pSortableColumn="tckn">Tc No <p-sortIcon field="tckn"></p-sortIcon></th>
                        <th pSortableColumn="phoneNumber">Telefon <p-sortIcon field="phoneNumber"></p-sortIcon></th>
                        <th pSortableColumn="birthDate">Doğum Tarihi <p-sortIcon field="birthDate"></p-sortIcon></th>                        
                        <th>İşlemler</th>
                    </tr>
                </ng-template>

                <ng-template pTemplate="body" let-patient>
                    <tr>
                        <td style="width:40%; min-width:10rem;">
                            <span class="p-column-title">Ad Soyad</span>
                            {{patient.fullName}}
                        </td>

                        <td style="width:40%; min-width:10rem;">
                            <span class="p-column-title">TC No</span>
                            {{patient.tckn}}
                        </td>

                        <td style="width:40%; min-width:10rem;">
                            <span class="p-column-title">Telefon</span>
                            {{patient.phoneNumber}}
                        </td>

                        <td style="width:40%; min-width:10rem;">
                            <span class="p-column-title">Doğum Tarihi</span>
                            {{patient.birthDate}}
                        </td>                      

                        <td style="width:20%; min-width:10rem;">
                            <div class="flex">
                                <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2"></button>
                                <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-warning"></button>
                                
                                <button 
                                        pButton 
                                        pRipple 
                                        icon="pi pi-images" 
                                        class="p-button-rounded p-button-info p-button-text" 
                                        pTooltip="Before/After Sunumu"
                                        [routerLink]="['/patients/presentation', patient.id]">
                                </button>
                                
                                <button pButton pRipple icon="pi pi-camera" class="p-button-rounded p-button-success p-button-text" pTooltip="Fotoğraf Yükle" (click)="openUploadDialog(patient.id)"></button>
                            </div>
                        </td>
                    </tr>
                </ng-template>

                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="5" class="text-center p-4">Hiç hasta kaydı bulunamadı.</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>

<p-dialog 
    header="Kliniğe Yeni Fotoğraf Yükle" 
    [(visible)]="uploadDialogVisible" 
    [modal]="true" 
    [style]="{width: '50vw'}" 
    [breakpoints]="{'960px': '75vw', '640px': '95vw'}"
    [draggable]="false" 
    [resizable]="false">
    
    <app-image-upload 
        *ngIf="uploadDialogVisible" 
        [patientId]="selectedPatientIdForUpload" 
        (onUploadSuccess)="handleUploadSuccess()">
    </app-image-upload>

</p-dialog>
