<p-card [header]="patientFullName">
    
    <div class="flex flex-wrap align-items-end justify-content-between mb-4 pb-3 border-bottom-1 surface-border">
        
        <div class="flex flex-wrap gap-3 w-full md:w-8">
            <div class="flex-1 min-w-min">
                <label class="block mb-2 font-bold text-primary">Fotoğraf Tipi (Açı)</label>
                <p-dropdown [options]="angleTypes" [(ngModel)]="selectedAngle" (onChange)="filterByAngle()" styleClass="w-full" placeholder="Açı Seçiniz"></p-dropdown>
            </div>
            <div class="flex-1 min-w-min">
                <label class="block mb-2 font-bold text-600">Önceki Durum</label>
                <p-dropdown [options]="dateOptions" [(ngModel)]="leftSelectedImage" styleClass="w-full" placeholder="Tarih Seç"></p-dropdown>
            </div>
            <div class="flex-1 min-w-min">
                <label class="block mb-2 font-bold text-primary">Mevcut Durum</label>
                <p-dropdown [options]="dateOptions" [(ngModel)]="rightSelectedImage" styleClass="w-full" placeholder="Tarih Seç"></p-dropdown>
            </div>
        </div>

        <div class="w-full md:w-auto mt-3 md:mt-0">
            <p-button 
                label="Kaydırmalı Görünüm" 
                icon="pi pi-sliders-h" 
                styleClass="p-button-help p-button-lg w-full shadow-2" 
                [disabled]="!leftSelectedImage || !rightSelectedImage"
                (onClick)="openSliderDialog()">
            </p-button>
        </div>
    </div>

    <div class="grid grid-nogutter border-round overflow-hidden shadow-3 surface-ground">
        
        <div class="col-12 md:col-6 p-1">
            <div class="flex flex-column h-full surface-card border-round">
                <div class="flex-grow-1 flex align-items-center justify-content-center bg-black-alpha-90" style="height: 60vh;">
                    <p-image *ngIf="leftSelectedImage" [src]="getFullImageUrl(leftSelectedImage.imageUrl)" alt="Önce" width="100%" [preview]="true" styleClass="w-full h-full flex align-items-center justify-content-center" imageClass="max-w-full max-h-full object-fit-contain"></p-image>
                    <span *ngIf="!leftSelectedImage" class="text-400">Bu açı için geçmiş kayıt yok</span>
                </div>
                <div class="p-2 text-sm text-center text-700 font-italic surface-overlay" style="min-height: 40px;">
                    <ng-container *ngIf="leftSelectedImage?.notes"><i class="pi pi-info-circle mr-1"></i> {{ leftSelectedImage.notes }}</ng-container>
                </div>
            </div>
        </div>

        <div class="col-12 md:col-6 p-1">
            <div class="flex flex-column h-full surface-card border-round">
                <div class="flex-grow-1 flex align-items-center justify-content-center bg-black-alpha-90" style="height: 60vh;">
                    <p-image *ngIf="rightSelectedImage" [src]="getFullImageUrl(rightSelectedImage.imageUrl)" alt="Sonra" width="100%" [preview]="true" styleClass="w-full h-full flex align-items-center justify-content-center" imageClass="max-w-full max-h-full object-fit-contain"></p-image>
                    <span *ngIf="!rightSelectedImage" class="text-400">Bu açı için güncel kayıt yok</span>
                </div>
                <div class="p-2 text-sm text-center text-primary font-italic surface-overlay" style="min-height: 40px;">
                    <ng-container *ngIf="rightSelectedImage?.notes"><i class="pi pi-check-circle mr-1"></i> {{ rightSelectedImage.notes }}</ng-container>
                </div>
            </div>
        </div>
    </div>
</p-card>


<p-dialog 
    header="Etkileşimli Karşılaştırma" 
    [(visible)]="sliderDialogVisible" 
    [modal]="true" 
    [style]="{width: '80vw'}" 
    [maximizable]="true"
    [draggable]="false" 
    [resizable]="false"
    contentStyleClass="bg-black-alpha-90 p-0">
    
    <div class="before-after-container" *ngIf="sliderDialogVisible">
        
        <img [src]="getFullImageUrl(rightSelectedImage.imageUrl)" class="compare-image" alt="Sonra">

        <img [src]="getFullImageUrl(leftSelectedImage.imageUrl)" class="compare-image" alt="Önce"
             [style.clip-path]="'polygon(0 0, ' + sliderValue + '% 0, ' + sliderValue + '% 100%, 0 100%)'">

        <div class="slider-line" [style.left.%]="sliderValue">
            <div class="slider-button">
                <i class="pi pi-arrows-h text-xl"></i>
            </div>
        </div>

        <input type="range" min="0" max="100" [(ngModel)]="sliderValue" class="slider-overlay">
        
        <div class="absolute top-0 left-0 p-2 m-3 bg-black-alpha-60 text-white border-round font-bold shadow-2 z-5">
            Önceki: {{ leftSelectedImage.recordDate | date:'dd.MM.yyyy' }}
        </div>
        <div class="absolute top-0 right-0 p-2 m-3 bg-primary text-white border-round font-bold shadow-2 z-5">
            Mevcut: {{ rightSelectedImage.recordDate | date:'dd.MM.yyyy' }}
        </div>
    </div>
</p-dialog>
