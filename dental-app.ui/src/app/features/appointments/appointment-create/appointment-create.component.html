<p-toast></p-toast>

<div class="grid">
    <div class="col-12 md:col-8 mx-auto">
        <div class="card p-fluid">
            <h5>Yeni Randevu Oluştur</h5>

            <div class="field mt-4">
                <label>Hasta Seçin</label>
                <p-dropdown 
                    [options]="patients" 
                    [(ngModel)]="appointmentModel.patientId" 
                    optionLabel="fullName" 
                    optionValue="id" 
                    [filter]="true" 
                    filterBy="fullName" 
                    [showClear]="true"
                    placeholder="Hasta seçiniz...">
                </p-dropdown>
            </div>

            <div class="field">
                <label>Randevu Günü</label>
                <p-calendar 
                    [(ngModel)]="selectedDate" 
                    [showIcon]="true" 
                    (onSelect)="onDateSelect($event)" 
                    placeholder="Tarih Seçiniz"
                    dateFormat="dd.mm.yy"
                    [minDate]="today" 
                    [disabledDays]="[0, 6]"> 
                </p-calendar>
            </div>

            <div class="field mt-4" *ngIf="selectedDate">
                <label class="font-bold text-primary mb-3 block">Uygun Saatler</label>
                
                <div class="grid formgrid gap-2">
                    <div class="col-fixed" *ngFor="let slot of timeSlots" style="width: 100px;">
                        <button pButton pRipple 
                                [label]="slot.time" 
                                (click)="selectTime(slot)"
                                [disabled]="slot.isBooked"
                                [ngClass]="{
                                    'p-button-danger': slot.isBooked, 
                                    'p-button-outlined': !slot.isBooked && !selectedTimes.includes(slot.time),
                                    'p-button-primary': selectedTimes.includes(slot.time)
                                }">
                        </button>
                    </div>
                </div>

                <small class="block mt-2 text-500">
                    <i class="pi pi-info-circle mr-1"></i> 
                    Kırmızı alanlar doludur. Uzun sürecek işlemler için <strong>birden fazla ardışık saat</strong> seçerek süreyi uzatabilirsiniz.
                </small>
            </div>

            <div class="field mt-4">
                <label>Notlar (Opsiyonel)</label>
                <textarea pInputTextarea [(ngModel)]="appointmentModel.notes" rows="3"></textarea>
            </div>

            <div class="flex justify-content-end mt-4">
                <button pButton 
                        [label]="selectedTimes.length > 1 ? selectedTimes.length * 30 + ' Dakikalık Randevuyu Kaydet' : 'Randevuyu Kaydet'" 
                        icon="pi pi-check" 
                        class="p-button-success w-auto" 
                        [loading]="loading" 
                        (click)="save()">
                </button>
            </div>
        </div>
    </div>
</div>
